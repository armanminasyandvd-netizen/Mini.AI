
<!doctype html>
<html lang="hy" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini.AI</title>
  <meta name="description" content="Mini.AI — your local AI assistant">
  <meta name="theme-color" content="#0a0a0a">

  <script>
    try {
      const s = JSON.parse(localStorage.getItem('mini.settings') || '{}');
      document.documentElement.classList.toggle('dark', (s.theme || 'dark') === 'dark');
      document.documentElement.lang = s.language || 'hy';
    } catch {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'Noto Sans Armenian', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { -webkit-font-smoothing: antialiased; }
    button, textarea, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .scrollbar-thin { scrollbar-width: thin; scrollbar-color: #555 transparent; }
    .md { line-height: 1.75; overflow-wrap: anywhere; }
    .md > * + * { margin-top: .8em; }
    .md h1 { font-size: 1.5em; font-weight: 600; }
    .md h2 { font-size: 1.3em; font-weight: 600; }
    .md h3 { font-size: 1.1em; font-weight: 600; }
    .md ul { list-style: disc; padding-left: 1.5em; }
    .md ol { list-style: decimal; padding-left: 1.5em; }
    .md li + li { margin-top: .3em; }
    .md a { text-decoration: underline; }
    .md strong { font-weight: 600; }
    .md blockquote { border-left: 3px solid #777; padding-left: 1em; opacity: .85; }
    .md :not(pre) > code { padding: .15em .4em; border-radius: .4em; background: #8882; font-size: .88em; }
    .md pre { overflow-x: auto; border: 1px solid #8883; border-radius: .8rem; padding: 1rem; background: #8881; }
    .md table { border-collapse: collapse; display: block; overflow-x: auto; }
    .md td, .md th { border: 1px solid #8885; padding: .4em .7em; }
    .dots span { animation: blink 1.1s infinite; }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 50% { opacity: .2; transform: translateY(-2px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .rise { animation: rise .2s ease-out; }
    html { font-size: var(--ui-scale, 100%); }
    #sidebar { width: var(--sidebar-width, 280px); }
    #messages { gap: var(--message-gap, 1.5rem); }
    [data-density="compact"] #messages { gap: 1rem; }
    [data-density="comfortable"] #messages { gap: 1.5rem; }
    [data-density="spacious"] #messages { gap: 2.5rem; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body class="bg-white font-sans text-neutral-950 dark:bg-[#0a0a0a] dark:text-neutral-50">
<div class="flex h-dvh overflow-hidden">

  <div id="backdrop" class="fixed inset-0 z-30 hidden bg-black/60 md:hidden"></div>

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex -translate-x-full flex-col border-r border-neutral-200 bg-neutral-50 transition-transform dark:border-neutral-900 dark:bg-black md:static md:translate-x-0">
    <div class="flex items-center justify-between px-4 py-4">
      <div class="flex items-center gap-2">
        <div class="flex size-9 items-center justify-center rounded-xl bg-neutral-950 text-sm font-bold text-white dark:bg-white dark:text-black">M</div>
        <span class="text-base font-semibold tracking-tight">Mini.AI</span>
      </div>
      <button id="closeSidebar" class="rounded-lg p-2 text-neutral-500 hover:bg-neutral-200 dark:hover:bg-neutral-900 md:hidden" aria-label="Close menu">✕</button>
    </div>

    <div class="px-3 pb-3">
      <button id="newChat" class="flex w-full items-center justify-between rounded-xl border border-neutral-200 bg-white px-3 py-2.5 text-sm font-medium hover:bg-neutral-100 dark:border-neutral-800 dark:bg-neutral-950 dark:hover:bg-neutral-900">
        <span data-t="newChat">Նոր զրույց</span><span class="text-lg">＋</span>
      </button>
    </div>

    <div class="px-5 pb-1 text-xs font-medium text-neutral-500" data-t="history">Զրույցների պատմություն</div>
    <nav id="history" class="scrollbar-thin flex-1 overflow-y-auto px-3 pb-3"></nav>

    <div class="border-t border-neutral-200 p-3 dark:border-neutral-900">
      <button id="settingsButton" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm hover:bg-neutral-200 dark:hover:bg-neutral-900">
        <span>⚙</span><span data-t="settings">Կարգավորումներ</span>
      </button>
    </div>
  </aside>

  <main class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 shrink-0 items-center justify-between gap-2 px-3 md:px-5">
      <div class="flex min-w-0 items-center gap-2">
        <button id="openSidebar" class="rounded-lg p-2 text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-900 md:hidden" aria-label="Open menu">☰</button>
        <span id="modelName" class="truncate text-sm font-semibold">Gemma 4 E2B · Local</span>
        <span class="rounded-full border border-neutral-300 px-2 py-0.5 text-[10px] text-neutral-500 dark:border-neutral-700">LOCAL</span>
      </div>
      <button id="headerNewChat" class="rounded-lg p-2 text-lg text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-900" aria-label="New chat">＋</button>
    </header>

    <div id="scroller" class="scrollbar-thin flex-1 overflow-y-auto">
      <div id="messages" class="mx-auto flex w-full max-w-3xl flex-col px-4 pb-8 pt-3 md:px-6"></div>
    </div>

    <div class="shrink-0 px-3 pb-3 md:px-6 md:pb-4" style="padding-bottom:max(.75rem,env(safe-area-inset-bottom))">
      <form id="composer" class="mx-auto w-full max-w-3xl">
        <div class="flex items-end gap-2 rounded-[26px] border border-neutral-200 bg-neutral-50 p-2 pl-4 shadow-sm focus-within:border-neutral-400 dark:border-neutral-800 dark:bg-neutral-950 dark:focus-within:border-neutral-600">
          <textarea id="input" rows="1" class="max-h-52 min-h-10 flex-1 resize-none bg-transparent py-2 text-[15px] leading-6 outline-none placeholder:text-neutral-500" placeholder="Գրեք Mini.AI-ին"></textarea>
          <button id="sendButton" type="submit" class="flex size-10 shrink-0 items-center justify-center rounded-full bg-neutral-950 text-lg text-white hover:opacity-80 disabled:opacity-30 dark:bg-white dark:text-black" aria-label="Send">↑</button>
        </div>
        <p class="mt-2 text-center text-xs text-neutral-500" data-t="disclaimer">Mini.AI-ը կարող է սխալվել։ Ստուգեք կարևոր տեղեկությունները։</p>
      </form>
    </div>
  </main>
</div>

<div id="settingsModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/70 p-0 backdrop-blur-sm sm:items-center sm:p-4">
  <div role="dialog" aria-modal="true" aria-labelledby="settingsTitle" class="flex max-h-[92dvh] w-full flex-col overflow-hidden rounded-t-3xl border border-neutral-200 bg-white shadow-2xl dark:border-neutral-800 dark:bg-[#111] sm:max-w-lg sm:rounded-3xl">
    <div class="flex items-center justify-between border-b border-neutral-200 px-6 py-4 dark:border-neutral-800">
      <h2 id="settingsTitle" class="font-semibold" data-t="settings">Կարգավորումներ</h2>
      <button id="closeSettings" class="rounded-lg px-3 py-2 text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-900" aria-label="Close">✕</button>
    </div>
    <div id="settingsBody" class="scrollbar-thin overflow-y-auto px-6"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const MODEL = 'gemma4:e2b';

  const LANG = {
    hy: {
      newChat:'Նոր զրույց', history:'Զրույցների պատմություն', settings:'Կարգավորումներ',
      disclaimer:'Mini.AI-ը կարող է սխալվել։ Ստուգեք կարևոր տեղեկությունները։',
      placeholder:'Գրեք Mini.AI-ին', greeting:'Ինչո՞վ կարող եմ օգնել։',
      sub:'Հարցրեք ցանկացած բան։ Գրեք, սովորեք, պլանավորեք կամ ստեղծեք։',
      suggestions:[
        ['Բացատրիր հասկացություն','Բացատրիր արհեստական բանականությունը պարզ բառերով։'],
        ['Գրիր ինչ-որ բան','Գրիր կարճ նամակ՝ հանդիպումը տեղափոխելու համար։'],
        ['Պլանավորիր ուղևորություն','Կազմիր 3-օրյա ուղևորության պլան Երևանում։'],
        ['Օգնիր կոդի հարցում','Բացատրիր Python-ի հիմնական գաղափարները։']
      ],
      language:'Լեզու', languageDesc:'Ինտերֆեյսի և AI պատասխանների լեզուն',
      theme:'Թեմա', dark:'Մուգ', light:'Բաց', system:'Համակարգային',
      interfaceSize:'Ինտերֆեյսի չափը', density:'Տարածության ռեժիմ',
      compact:'Կոմպակտ', comfortable:'Սովորական', spacious:'Ընդարձակ',
      sidebarSize:'Մենյուի լայնություն', resetLayout:'Վերականգնել չափերը',
      aiPreferences:'AI նախընտրություններ', responseStyle:'Պատասխանի ոճ',
      concise:'Հակիրճ', balanced:'Հավասարակշռված', detailed:'Մանրամասն',
      instructions:'Անհատական հրահանգներ',
      instructionsPh:'Ինչպե՞ս պետք է Mini.AI-ը պատասխանի։',
      dataControls:'Տվյալների կառավարում',
      clearChatsDesc:'Ջնջել այս բրաուզերի բոլոր զրույցները։', clear:'Ջնջել',
      copy:'Պատճենել', copied:'Պատճենված է', regenerate:'Կրկնել պատասխանը',
      stop:'Դադարեցնել', send:'Ուղարկել', delete:'Ջնջել զրույցը',
      thinking:'Մտածում եմ', error:'Պատասխանը ստանալ չհաջողվեց։',
      retry:'Կրկնել', you:'Դուք', connection:'Միացում',
      connectionDesc:'Աշխատում է տեղային app.py սերվերի և Ollama-ի միջոցով։ API բանալի պետք չէ։',
      localModel:'Տեղային մոդել', status:'Կարգավիճակ',
      statusDesc:'Սերվերը պետք է աշխատի ձեր համակարգչում։',
      models:{fast:'Տեղային Ollama մոդել'}
    },
    en: {
      newChat:'New chat', history:'Chat history', settings:'Settings',
      disclaimer:'Mini.AI can make mistakes. Check important information.',
      placeholder:'Message Mini.AI', greeting:'What can I help with?',
      sub:'Ask anything. Write, learn, plan, or create.',
      suggestions:[
        ['Explain a concept','Explain artificial intelligence in simple terms.'],
        ['Write something','Write a short email to reschedule a meeting.'],
        ['Plan a trip','Plan a 3-day trip to Yerevan.'],
        ['Help me code','Explain the basics of Python.']
      ],
      language:'Language', languageDesc:'Interface and AI response language',
      theme:'Theme', dark:'Dark', light:'Light', system:'System',
      interfaceSize:'Interface size', density:'Spacing mode',
      compact:'Compact', comfortable:'Comfortable', spacious:'Spacious',
      sidebarSize:'Menu width', resetLayout:'Reset layout',
      aiPreferences:'AI preferences', responseStyle:'Response style',
      concise:'Concise', balanced:'Balanced', detailed:'Detailed',
      instructions:'Custom instructions',
      instructionsPh:'How should Mini.AI respond?',
      dataControls:'Data controls', clearChatsDesc:'Delete all chats in this browser.',
      clear:'Clear', copy:'Copy', copied:'Copied', regenerate:'Regenerate',
      stop:'Stop generating', send:'Send message', delete:'Delete chat',
      thinking:'Thinking', error:'Could not get a response.', retry:'Retry', you:'You',
      connection:'Connection',
      connectionDesc:'Uses your local app.py server and Ollama. No API key required.',
      localModel:'Local model', status:'Status',
      statusDesc:'The server must be running on your computer.',
      models:{fast:'Local Ollama model'}
    },
    ru: {
      newChat:'Новый чат', history:'История чатов', settings:'Настройки',
      disclaimer:'Mini.AI может ошибаться. Проверяйте важную информацию.',
      placeholder:'Сообщение для Mini.AI', greeting:'Чем могу помочь?',
      sub:'Спрашивайте, пишите, учитесь, планируйте и создавайте.',
      suggestions:[
        ['Объясни понятие','Объясни искусственный интеллект простыми словами.'],
        ['Напиши текст','Напиши короткое письмо о переносе встречи.'],
        ['Спланируй поездку','Составь план поездки в Ереван на 3 дня.'],
        ['Помоги с кодом','Объясни основы Python.']
      ],
      language:'Язык', languageDesc:'Язык интерфейса и ответов ИИ',
      theme:'Тема', dark:'Тёмная', light:'Светлая', system:'Системная',
      interfaceSize:'Размер интерфейса', density:'Интервалы',
      compact:'Компактный', comfortable:'Обычный', spacious:'Просторный',
      sidebarSize:'Ширина меню', resetLayout:'Сбросить размеры',
      aiPreferences:'Настройки ИИ', responseStyle:'Стиль ответа',
      concise:'Кратко', balanced:'Сбалансированно', detailed:'Подробно',
      instructions:'Пользовательские инструкции',
      instructionsPh:'Как должен отвечать Mini.AI?',
      dataControls:'Управление данными',
      clearChatsDesc:'Удалить все чаты в этом браузере.', clear:'Удалить',
      copy:'Копировать', copied:'Скопировано', regenerate:'Повторить ответ',
      stop:'Остановить', send:'Отправить', delete:'Удалить чат',
      thinking:'Думаю', error:'Не удалось получить ответ.', retry:'Повторить',
      you:'Вы', connection:'Подключение',
      connectionDesc:'Использует локальный сервер app.py и Ollama. API-ключ не нужен.',
      localModel:'Локальная модель', status:'Статус',
      statusDesc:'Сервер должен работать на вашем компьютере.',
      models:{fast:'Локальная модель Ollama'}
    }
  };

  const defaults = {
    language:'hy', theme:'dark', style:'balanced', instructions:'',
    uiScale:100, density:'compact', sidebarWidth:100
  };

  function load(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch { return fallback; }
  }

  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  const state = {
    settings:{...defaults, ...load('mini.settings', {})},
    chats:load('mini.chats', []),
    activeId:null,
    streaming:null,
    copiedId:null
  };

  const $ = s => document.querySelector(s);
  const els = {
    sidebar:$('#sidebar'), backdrop:$('#backdrop'), history:$('#history'),
    messages:$('#messages'), scroller:$('#scroller'), input:$('#input'),
    send:$('#sendButton'), composer:$('#composer'),
    modal:$('#settingsModal'), settingsBody:$('#settingsBody')
  };

  const t = () => LANG[state.settings.language] || LANG.hy;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const activeChat = () => state.chats.find(c => c.id === state.activeId) || null;

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[c]);
  }

  function markdown(value) {
    if (window.marked && window.DOMPurify) {
      return DOMPurify.sanitize(marked.parse(value, {breaks:true, gfm:true}));
    }
    return '<p>' + escapeHtml(value).replace(/\n/g,'<br>') + '</p>';
  }

  function persistChats() {
    save('mini.chats', state.chats);
  }

  function applyTheme() {
    const theme = state.settings.theme;
    const dark = theme === 'dark' ||
      (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.content = dark ? '#0a0a0a' : '#ffffff';
  }

  function applyLayout() {
    const s = state.settings;
    document.documentElement.style.setProperty('--ui-scale',
      Math.max(85, Math.min(120, Number(s.uiScale) || 100)) + '%');
    document.documentElement.style.setProperty('--sidebar-width',
      Math.round(280 * Math.max(70, Math.min(130, Number(s.sidebarWidth) || 100)) / 100) + 'px');
    document.documentElement.dataset.density = s.density || 'compact';
  }

  function applyText() {
    document.documentElement.lang = state.settings.language;
    document.querySelectorAll('[data-t]').forEach(el => {
      const key = el.dataset.t;
      if (t()[key] !== undefined) el.textContent = t()[key];
    });
    els.input.placeholder = t().placeholder;
  }

  function renderSidebar() {
    if (!state.chats.length) {
      els.history.innerHTML = '<p class="px-3 py-8 text-center text-sm text-neutral-500">' +
        escapeHtml(t().history) + '</p>';
      return;
    }

    els.history.innerHTML = state.chats
      .slice().sort((a,b) => b.updatedAt - a.updatedAt)
      .map(c => `
        <div class="group relative mb-1">
          <button type="button" data-chat="${escapeHtml(c.id)}"
            class="w-full truncate rounded-lg py-2 pl-3 pr-10 text-left text-sm ${
              c.id === state.activeId
                ? 'bg-neutral-200 text-neutral-950 dark:bg-neutral-900 dark:text-white'
                : 'text-neutral-700 hover:bg-neutral-200/70 dark:text-neutral-300 dark:hover:bg-neutral-900'
            }">${escapeHtml(c.title || 'New chat')}</button>
          <button type="button" data-delete="${escapeHtml(c.id)}"
            aria-label="${escapeHtml(t().delete)}"
            class="absolute right-1 top-1/2 -translate-y-1/2 rounded-md px-2 py-1 text-neutral-500 hover:bg-neutral-300 dark:hover:bg-neutral-800">×</button>
        </div>
      `).join('');
  }

  function renderEmpty() {
    const d = t();
    els.messages.innerHTML = `
      <div class="flex min-h-[calc(100dvh-15rem)] flex-col items-center justify-center gap-8 py-8">
        <div class="rise flex flex-col items-center gap-4 text-center">
          <div class="flex size-16 items-center justify-center rounded-3xl bg-neutral-950 text-2xl font-bold text-white dark:bg-white dark:text-black">M</div>
          <h1 class="text-2xl font-semibold tracking-tight md:text-3xl">${escapeHtml(d.greeting)}</h1>
          <p class="text-sm text-neutral-500">${escapeHtml(d.sub)}</p>
        </div>
        <div class="grid w-full max-w-2xl grid-cols-1 gap-2.5 sm:grid-cols-2">
          ${d.suggestions.map(s => `
            <button type="button" data-suggest="${escapeHtml(s[1])}"
              class="rise rounded-2xl border border-neutral-200 p-4 text-left hover:bg-neutral-50 dark:border-neutral-800 dark:hover:bg-neutral-950">
              <span class="block text-sm font-medium">${escapeHtml(s[0])}</span>
              <span class="mt-1 block text-sm text-neutral-500">${escapeHtml(s[1])}</span>
            </button>`).join('')}
        </div>
      </div>`;
  }

  function renderMessages() {
    const chat = activeChat();
    if (!chat || !chat.messages.length) {
      renderEmpty();
      return;
    }

    els.messages.innerHTML = chat.messages.map((m, i) => {
      if (m.role === 'user') {
        return `<div class="rise flex justify-end">
          <div class="max-w-[85%] whitespace-pre-wrap break-words rounded-3xl bg-neutral-100 px-4 py-2.5 text-[15px] leading-relaxed dark:bg-neutral-900">${escapeHtml(m.content)}</div>
        </div>`;
      }

      const waiting = !m.content && state.streaming && state.streaming.chatId === chat.id;
      const actions = m.content ? `
        <div class="mt-1 flex items-center gap-1">
          <button type="button" data-action="copy" data-index="${i}"
            class="rounded-lg px-2 py-1 text-xs text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-900">${state.copiedId === i ? t().copied : t().copy}</button>
          ${i === chat.messages.length - 1 && !state.streaming ? `
            <button type="button" data-action="regenerate" data-index="${i}"
              class="rounded-lg px-2 py-1 text-xs text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-900">${t().regenerate}</button>` : ''}
        </div>` : '';

      return `<div class="rise flex gap-3.5" ${waiting ? 'data-streaming' : ''}>
        <div class="flex size-8 shrink-0 items-center justify-center rounded-full border border-neutral-200 text-xs font-semibold dark:border-neutral-800">M</div>
        <div class="min-w-0 flex-1 pt-0.5">
          <div class="msg-body">${m.content
            ? '<div class="md text-[15px]">' + markdown(m.content) + '</div>'
            : `<div class="dots flex h-7 items-center gap-1" aria-label="${escapeHtml(t().thinking)}"><span class="size-1.5 rounded-full bg-current"></span><span class="size-1.5 rounded-full bg-current"></span><span class="size-1.5 rounded-full bg-current"></span></div>`}
          </div>${actions}
        </div>
      </div>`;
    }).join('');

    if (chat.error) {
      els.messages.insertAdjacentHTML('beforeend', `
        <div class="rounded-2xl border border-red-500/30 bg-red-500/5 p-4 text-sm">
          <p class="font-medium text-red-500">${escapeHtml(t().error)}</p>
          <p class="mt-1 whitespace-pre-wrap break-words text-neutral-500">${escapeHtml(chat.error)}</p>
          <button type="button" data-action="retry" class="mt-3 rounded-full border border-neutral-300 px-3 py-1 dark:border-neutral-700">${escapeHtml(t().retry)}</button>
        </div>`);
    }
  }

  function renderComposer() {
    if (state.streaming) {
      els.send.textContent = '■';
      els.send.setAttribute('aria-label', t().stop);
      els.send.disabled = false;
    } else {
      els.send.textContent = '↑';
      els.send.setAttribute('aria-label', t().send);
      els.send.disabled = !els.input.value.trim();
    }
  }

  function renderAll() {
    applyText();
    renderSidebar();
    renderMessages();
    renderComposer();
  }

  function scrollBottom(smooth = false) {
    els.scroller.scrollTo({
      top:els.scroller.scrollHeight,
      behavior:smooth ? 'smooth' : 'auto'
    });
  }

  function buildSettings() {
    const d = t();
    const s = state.settings;

    function section(title, description, content) {
      return `<section class="flex flex-col gap-3 border-b border-neutral-200 py-5 last:border-0 dark:border-neutral-800">
        <div><h3 class="text-sm font-medium">${escapeHtml(title)}</h3>
        ${description ? `<p class="mt-1 text-xs leading-relaxed text-neutral-500">${escapeHtml(description)}</p>` : ''}</div>
        ${content}
      </section>`;
    }

    function selectButtons(key, value, options) {
      return `<div class="grid grid-cols-1 gap-1.5 sm:grid-cols-3">${options.map(o => `
        <button type="button" data-setting="${key}" data-value="${o.value}"
          class="rounded-xl border px-3 py-2 text-sm ${
            value === o.value
              ? 'border-neutral-950 bg-neutral-100 dark:border-white dark:bg-neutral-900'
              : 'border-neutral-200 hover:bg-neutral-50 dark:border-neutral-800 dark:hover:bg-neutral-900'
          }">${escapeHtml(o.label)}</button>`).join('')}</div>`;
    }

    const inputClass = 'w-full rounded-xl border border-neutral-200 bg-transparent px-3 py-2.5 text-sm outline-none focus:border-neutral-400 dark:border-neutral-800 dark:focus:border-neutral-600';

    els.settingsBody.innerHTML =
      section(d.language, d.languageDesc,
        selectButtons('language', s.language, [
          {value:'hy',label:'Հայերեն'}, {value:'en',label:'English'}, {value:'ru',label:'Русский'}
        ])) +
      section(d.theme, '',
        selectButtons('theme', s.theme, [
          {value:'dark',label:d.dark}, {value:'light',label:d.light}, {value:'system',label:d.system}
        ])) +
      section(d.interfaceSize, '',
        `<label class="flex items-center justify-between text-sm"><span>${escapeHtml(d.interfaceSize)}</span><output id="scaleOut">${Number(s.uiScale)}%</output></label>
        <input data-field="uiScale" type="range" min="85" max="120" value="${Number(s.uiScale)}" class="w-full accent-neutral-900 dark:accent-white">
        <label class="mt-2 block text-sm">${escapeHtml(d.density)}</label>
        ${selectButtons('density',s.density,[
          {value:'compact',label:d.compact},{value:'comfortable',label:d.comfortable},{value:'spacious',label:d.spacious}
        ])}
        <label class="mt-3 flex items-center justify-between text-sm"><span>${escapeHtml(d.sidebarSize)}</span><output id="sidebarOut">${Number(s.sidebarWidth)}%</output></label>
        <input data-field="sidebarWidth" type="range" min="70" max="130" value="${Number(s.sidebarWidth)}" class="w-full accent-neutral-900 dark:accent-white">
        <button type="button" data-reset-layout class="mt-2 rounded-full border border-neutral-300 px-3 py-1.5 text-xs dark:border-neutral-700">${escapeHtml(d.resetLayout)}</button>`) +
      section(d.aiPreferences, '',
        `<div class="rounded-xl border border-neutral-200 p-3 dark:border-neutral-800">
          <div class="text-sm font-medium">Gemma 4 E2B · Local</div>
          <div class="mt-1 text-xs text-neutral-500">${escapeHtml(d.models.fast)}</div>
          <div class="mt-2 text-xs text-neutral-500">Ollama · ${MODEL}</div>
        </div>
        <label class="block text-sm">${escapeHtml(d.responseStyle)}</label>
        ${selectButtons('style',s.style,[
          {value:'concise',label:d.concise},{value:'balanced',label:d.balanced},{value:'detailed',label:d.detailed}
        ])}
        <label class="block text-sm">${escapeHtml(d.instructions)}</label>
        <textarea data-field="instructions" rows="3" maxlength="1000" placeholder="${escapeHtml(d.instructionsPh)}" class="${inputClass}">${escapeHtml(s.instructions)}</textarea>`) +
      section(d.connection, d.connectionDesc,
        `<div class="rounded-xl bg-neutral-100 p-3 text-sm dark:bg-neutral-900">
          <div class="flex items-center justify-between"><span>${escapeHtml(d.localModel)}</span><span class="font-medium">${MODEL}</span></div>
          <p class="mt-2 text-xs text-neutral-500">${escapeHtml(d.statusDesc)}</p>
          <p class="mt-2 text-xs text-neutral-500">http://127.0.0.1:8000</p>
        </div>`) +
      section(d.dataControls, d.clearChatsDesc,
        `<button type="button" data-clear class="rounded-full border border-red-500/50 px-4 py-2 text-sm text-red-500 hover:bg-red-500/10">${escapeHtml(d.clear)}</button>`);
  }

  function openSettings() {
    closeSidebar();
    buildSettings();
    els.modal.classList.remove('hidden');
    els.modal.classList.add('flex');
  }

  function closeSettings() {
    els.modal.classList.add('hidden');
    els.modal.classList.remove('flex');
  }

  function updateSetting(key, value) {
    state.settings[key] = value;
    save('mini.settings', state.settings);
    if (key === 'theme') applyTheme();
    if (['uiScale','density','sidebarWidth'].includes(key)) applyLayout();
    renderAll();
  }

  function resizeInput() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 208) + 'px';
    renderComposer();
  }

  async function streamFromApi(chat, assistant, signal) {
    const messages = chat.messages;
    const userIndex = messages.length - 2;

    if (userIndex < 0 || messages[userIndex].role !== 'user') {
      throw new Error('Չգտա վերջին հարցը։ Փորձիր նորից։');
    }

    const userMessage = messages[userIndex].content;
    const history = messages.slice(0, userIndex).map(m => ({
      role:m.role,
      content:m.content
    }));

    let res;
    try {
      res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal,
        body:JSON.stringify({
          message:userMessage,
          history,
          language:state.settings.language,
          style:state.settings.style,
          instructions:state.settings.instructions
        })
      });
    } catch (err) {
      if (err.name === 'AbortError') throw err;
      throw new Error('Չհաջողվեց միանալ Mini.AI սերվերին։ Գործարկիր app.py-ն և բացիր http://127.0.0.1:8000');
    }

    let data;
    try {
      data = await res.json();
    } catch {
      throw new Error('Սերվերի պատասխանը ճիշտ JSON չէ։ Ստուգիր app.py-ն։');
    }

    if (!res.ok) {
      const detail = typeof data.error === 'string'
        ? data.error
        : (data.message || 'HTTP ' + res.status);
      throw new Error(detail);
    }

    const answer = data.response || data.reply || data.message || '';
    if (typeof answer !== 'string' || !answer.trim()) {
      throw new Error('Ollama-ից դատարկ պատասխան ստացվեց։ Ստուգիր՝ արդյոք մոդելը տեղադրված է։');
    }

    assistant.content = answer;
    renderMessages();
    scrollBottom();
  }

  async function generate(chat) {
    if (state.streaming) return;
    chat.error = null;

    const assistant = {role:'assistant',content:''};
    chat.messages.push(assistant);

    const controller = new AbortController();
    state.streaming = {chatId:chat.id,controller};
    renderAll();
    scrollBottom(true);

    try {
      await streamFromApi(chat, assistant, controller.signal);
    } catch (err) {
      if (err.name !== 'AbortError') {
        chat.error = err.message || t().error;
      }
    } finally {
      if (!assistant.content) {
        const index = chat.messages.indexOf(assistant);
        if (index !== -1) chat.messages.splice(index,1);
      }
      chat.updatedAt = Date.now();
      state.streaming = null;
      persistChats();
      renderAll();
      scrollBottom();
    }
  }

  function send(text) {
    text = String(text || '').trim();
    if (!text || state.streaming) return;

    let chat = activeChat();
    if (!chat) {
      chat = {
        id:uid(),
        title:text.replace(/\s+/g,' ').slice(0,48),
        messages:[],
        updatedAt:Date.now()
      };
      state.chats.unshift(chat);
      state.activeId = chat.id;
    }

    chat.messages.push({role:'user',content:text});
    chat.updatedAt = Date.now();
    chat.error = null;
    els.input.value = '';
    resizeInput();
    persistChats();
    renderAll();
    generate(chat);
  }

  function newChat() {
    if (state.streaming) state.streaming.controller.abort();
    state.activeId = null;
    closeSidebar();
    renderAll();
    els.input.focus();
  }

  function openSidebar() {
    els.sidebar.classList.remove('-translate-x-full');
    els.backdrop.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    els.sidebar.classList.add('-translate-x-full');
    els.backdrop.classList.add('hidden');
    document.body.style.overflow = '';
  }

  $('#newChat').addEventListener('click',newChat);
  $('#headerNewChat').addEventListener('click',newChat);
  $('#openSidebar').addEventListener('click',openSidebar);
  $('#closeSidebar').addEventListener('click',closeSidebar);
  els.backdrop.addEventListener('click',closeSidebar);
  $('#settingsButton').addEventListener('click',openSettings);
  $('#closeSettings').addEventListener('click',closeSettings);
  els.modal.addEventListener('click',e => {
    if (e.target === els.modal) closeSettings();
  });

  document.addEventListener('keydown',e => {
    if (e.key === 'Escape') {
      closeSettings();
      closeSidebar();
    }
  });

  els.history.addEventListener('click',e => {
    const del = e.target.closest('[data-delete]');
    if (del) {
      const id = del.dataset.delete;
      if (state.streaming && state.streaming.chatId === id) {
        state.streaming.controller.abort();
      }
      state.chats = state.chats.filter(c => c.id !== id);
      if (state.activeId === id) state.activeId = null;
      persistChats();
      renderAll();
      return;
    }

    const item = e.target.closest('[data-chat]');
    if (item) {
      if (state.streaming && state.streaming.chatId !== item.dataset.chat) {
        state.streaming.controller.abort();
      }
      state.activeId = item.dataset.chat;
      closeSidebar();
      renderAll();
      scrollBottom();
    }
  });

  els.messages.addEventListener('click',e => {
    const suggestion = e.target.closest('[data-suggest]');
    if (suggestion) {
      send(suggestion.dataset.suggest);
      return;
    }

    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const chat = activeChat();
    if (!chat) return;

    const action = btn.dataset.action;

    if (action === 'copy') {
      const msg = chat.messages[Number(btn.dataset.index)];
      if (!msg) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg.content).then(() => {
          state.copiedId = Number(btn.dataset.index);
          renderMessages();
          setTimeout(() => {
            state.copiedId = null;
            renderMessages();
          },1500);
        }).catch(() => {});
      }
    }

    if (action === 'regenerate' && !state.streaming) {
      if (chat.messages[chat.messages.length - 1]?.role === 'assistant') {
        chat.messages.pop();
      }
      generate(chat);
    }

    if (action === 'retry' && !state.streaming) {
      generate(chat);
    }
  });

  els.composer.addEventListener('submit',e => {
    e.preventDefault();
    if (state.streaming) {
      state.streaming.controller.abort();
      return;
    }
    send(els.input.value);
  });

  els.input.addEventListener('input',resizeInput);
  els.input.addEventListener('keydown',e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if (!state.streaming) send(els.input.value);
    }
  });

  els.settingsBody.addEventListener('click',e => {
    const opt = e.target.closest('[data-setting]');
    if (opt) {
      updateSetting(opt.dataset.setting,opt.dataset.value);
      buildSettings();
      return;
    }

    if (e.target.closest('[data-reset-layout]')) {
      state.settings.uiScale = 100;
      state.settings.density = 'compact';
      state.settings.sidebarWidth = 100;
      save('mini.settings',state.settings);
      applyLayout();
      buildSettings();
      renderAll();
      return;
    }

    if (e.target.closest('[data-clear]')) {
      if (state.streaming) state.streaming.controller.abort();
      state.chats = [];
      state.activeId = null;
      persistChats();
      renderAll();
      closeSettings();
    }
  });

  els.settingsBody.addEventListener('input',e => {
    const field = e.target.dataset.field;
    if (!field) return;

    state.settings[field] = field === 'uiScale' || field === 'sidebarWidth'
      ? Number(e.target.value)
      : e.target.value;

    save('mini.settings',state.settings);
    applyLayout();

    if (field === 'uiScale') {
      const out = $('#scaleOut');
      if (out) out.textContent = state.settings.uiScale + '%';
    }
    if (field === 'sidebarWidth') {
      const out = $('#sidebarOut');
      if (out) out.textContent = state.settings.sidebarWidth + '%';
    }
  });

  window.addEventListener('resize',() => {
    if (window.innerWidth >= 768) closeSidebar();
  });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',() => {
    if (state.settings.theme === 'system') applyTheme();
  });

  applyTheme();
  applyLayout();
  renderAll();
})();
</script>
</body>
</html>
