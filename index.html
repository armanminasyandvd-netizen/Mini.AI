    async function streamFromApi(chat, onChunk, signal) {
      var s = state.settings;
      var headers = { 'Content-Type': 'application/json' };
      if (s.apiKey.trim()) headers.Authorization = 'Bearer ' + s.apiKey.trim();

      var res = await fetch(s.baseUrl.replace(/\/+$/, '') + '/chat/completions', {
        method: 'POST',
        headers: headers,
        signal: signal,
        body: JSON.stringify({
          model: s.customModel.trim() || s.model,
          stream: true,
          messages: [{ role: 'system', content: systemPrompt() }].concat(history),

      if (!res.ok) {
        var detail = '';
        try { var j = await res.json(); detail = (j.error && (j.error.message || j.error)) || j.message || ''; } catch (e) {}
        throw new Error('HTTP ' + res.status + (detail ? ' — ' + detail : ''));

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      while (true) {
        var r = await reader.read();
        if (r.done) break;
        buffer += decoder.decode(r.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line.startsWith('data:')) continue;
          var data = line.slice(5).trim();
          if (data === '[DONE]') return;
          try {
            var json = JSON.parse(data);
            var delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
            if (delta) onChunk(delta);
          } catch (e) {}
        }
      }
    }

    async function streamDemo(chat, onChunk, signal) {

      for (var i = 0; i < tokens.length; i++) {
        if (signal.aborted) return;
        await new Promise(function (r) { setTimeout(r, 22 + Math.random() * 30); });
        onChunk(tokens[i]);
      }
    }

    async function generate(chat) {
      chat.error = null;
      var assistant = { role: 'assistant', content: '' };
      chat.messages.push(assistant);
      var controller = new AbortController();
      state.streaming = { chatId: chat.id, controller: controller };
      renderAll();
      scrollToBottom(true);

      var onChunk = function (text) { assistant.content += text; scheduleStreamUpdate(); };
      try {
        if (isDemo()) await streamDemo(chat, onChunk, controller.signal);
        else await streamFromApi(chat, onChunk, controller.signal);
      } catch (err) {
        if (err.name !== 'AbortError') {
          chat.error = err.message === 'Failed to fetch'
            ? 'Network/CORS error — the API could not be reached from the browser. Check the base URL and key in Settings.'
            : err.message;
        }
      } finally {
        if (!assistant.content) chat.messages.pop();
        chat.updatedAt = Date.now();
        state.streaming = null;
        persistChats();
        renderAll();
      }
    }

    function send(text) {

        state.activeId = chat.id;

      chat.messages.push({ role: 'user', content: text });
      chat.updatedAt = Date.now();
      els.input.value = '';
      autosize();
      generate(chat);
    }

    function section(title, desc, inner) {
      return '<section class="flex flex-col gap-3 border-b border-neutral-200 py-5 last:border-b-0 dark:border-neutral-800">' +
        '<div><h3 class="text-sm font-medium">' + escapeHtml(title) + '</h3>' +
        (desc ? '<p class="mt-0.5 text-xs leading-relaxed text-neutral-500">' + escapeHtml(desc) + '</p>' : '') + '</div>' + inner + '</section>';
    }

    var inputClass = 'w-full rounded-xl border border-neutral-200 bg-transparent px-3.5 py-2.5 text-sm outline-none placeholder:text-neutral-500 focus:border-neutral-400 dark:border-neutral-800 dark:focus:border-neutral-600';

    function renderSettings() {
      var d = t();
      var s = state.settings;
      var models = MODELS.map(function (m) {
        var sel = s.model === m.id;
        return '<button type="button" role="radio" aria-checked="' + sel + '" data-setting="model" data-value="' + m.id + '" class="flex items-center justify-between gap-3 rounded-xl border px-3.5 py-3 text-left transition-colors ' +
          (sel ? 'border-neutral-950 bg-neutral-100 dark:border-white dark:bg-neutral-900' : 'border-neutral-200 hover:bg-neutral-50 dark:border-neutral-800 dark:hover:bg-neutral-900/60') + '">' +
          '<span><span class="block text-sm font-medium">' + m.name + '</span><span class="block text-xs text-neutral-500">' + escapeHtml(d.models[m.descKey]) + '</span></span>' +
          '<span class="flex size-5 shrink-0 items-center justify-center rounded-full border ' + (sel ? 'border-neutral-950 bg-neutral-950 text-white dark:border-white dark:bg-white dark:text-black' : 'border-neutral-300 dark:border-neutral-700') + '">' + (sel ? icon('check', 12) : '') + '</span></button>';
      }).join('');

      els.settingsBody.innerHTML =
        section(d.language, d.languageDesc, segmented(d.language, s.language, LANGUAGES.map(function (l) { return { key: 'language', value: l.code, label: l.native }; }))) +
        section(d.theme, '', segmented(d.theme, s.theme, [
          { key: 'theme', value: 'dark', label: d.dark, icon: 'moon' },
          { key: 'theme', value: 'light', label: d.light, icon: 'sun' },
          { key: 'theme', value: 'system', label: d.system, icon: 'monitor' },
        ])) +
        section(d.interfaceSize, d.interfaceSizeDesc,
          '<div class="flex flex-col gap-2"><div class="flex items-center justify-between gap-3"><label for="uiScale" class="text-xs font-medium text-neutral-500">' + escapeHtml(d.interfaceSize) + '</label><output id="uiScaleValue" class="text-xs tabular-nums text-neutral-500">' + Number(s.uiScale || 100) + '%</output></div>' +
          '<input id="uiScale" data-field="uiScale" type="range" min="85" max="120" step="1" value="' + Number(s.uiScale || 100) + '" class="w-full accent-neutral-900 dark:accent-white" />' +
          '<div class="flex justify-between text-[11px] text-neutral-500"><span>85%</span><span>120%</span></div></div>' +
          '<div class="mt-3 flex flex-col gap-2"><span class="text-xs font-medium text-neutral-500">' + escapeHtml(d.density) + '</span>' +
          segmented(d.density, s.density || 'compact', [
            { key: 'density', value: 'compact', label: d.compact },
            { key: 'density', value: 'comfortable', label: d.comfortable },
            { key: 'density', value: 'spacious', label: d.spacious },
          ]) + '</div>' +
          '<div class="mt-3 flex flex-col gap-2"><div class="flex items-center justify-between gap-3"><label for="sidebarWidth" class="text-xs font-medium text-neutral-500">' + escapeHtml(d.sidebarSize) + '</label><output id="sidebarWidthValue" class="text-xs tabular-nums text-neutral-500">' + Number(s.sidebarWidth || 100) + '%</output></div>' +
          '<input id="sidebarWidth" data-field="sidebarWidth" type="range" min="70" max="130" step="1" value="' + Number(s.sidebarWidth || 100) + '" class="w-full accent-neutral-900 dark:accent-white" />' +
          '<div class="flex justify-between text-[11px] text-neutral-500"><span>70%</span><span>100%</span><span>130%</span></div></div>' +
          '<button type="button" data-reset-layout class="mt-3 self-start rounded-full border border-neutral-300 px-3 py-1.5 text-xs font-medium hover:bg-neutral-100 dark:border-neutral-700 dark:hover:bg-neutral-900">' + escapeHtml(d.resetLayout) + '</button>') +
        section(d.aiPreferences, '',
          '<div class="flex flex-col gap-2"><span class="text-xs font-medium text-neutral-500">' + escapeHtml(d.model) + '</span><div role="radiogroup" aria-label="' + escapeHtml(d.model) + '" class="flex flex-col gap-1.5">' + models + '</div></div>' +
          '<div class="mt-2 flex flex-col gap-2"><span class="text-xs font-medium text-neutral-500">' + escapeHtml(d.responseStyle) + '</span>' +
          segmented(d.responseStyle, s.style, STYLES.map(function (st) { return { key: 'style', value: st, label: d[st] }; })) + '</div>' +
          '<div class="mt-2 flex flex-col gap-2"><label for="instructions" class="text-xs font-medium text-neutral-500">' + escapeHtml(d.customInstructions) + '</label>' +
          '<textarea id="instructions" data-field="instructions" rows="3" maxlength="1000" placeholder="' + escapeHtml(d.customPlaceholder) + '" class="resize-none ' + inputClass + '">' + escapeHtml(s.instructions) + '</textarea></div>') +
        section(d.dataControls, '',
          '<div class="flex items-center justify-between gap-4"><p class="text-sm text-neutral-500">' + escapeHtml(d.clearChatsDesc) + '</p>' +
          '<button type="button" data-clear ' + (state.chats.length ? '' : 'disabled') + ' class="shrink-0 rounded-full border border-red-500/50 px-4 py-1.5 text-sm font-medium text-red-500 transition-colors hover:bg-red-500/10 disabled:cursor-not-allowed disabled:opacity-40">' + escapeHtml(d.clear) + '</button></div>');
    }

    var lastFocus = null;
    function openSettings() {
      lastFocus = document.activeElement;
      closeSidebar();
      renderSettings();
      els.modal.classList.remove('hidden');
      els.modal.classList.add('flex');
      $('#closeSettings').focus();
    }

    function closeSettings() {
      els.modal.classList.add('hidden');
      els.modal.classList.remove('flex');
      if (lastFocus) lastFocus.focus();
    }

    function updateSetting(key, value) {
      state.settings[key] = value;
      save('mini.settings', state.settings);
      if (key === 'theme') applyTheme();
      if (key === 'uiScale' || key === 'density' || key === 'sidebarWidth') applyLayout();
    }

    $('#openSidebar').addEventListener('click', openSidebar);
    $('#closeSidebar').addEventListener('click', closeSidebar);
    els.backdrop.addEventListener('click', closeSidebar);
    $('#newChatBtn').addEventListener('click', newChat);
    $('#headerNewChat').addEventListener('click', newChat);
    $('#settingsBtn').addEventListener('click', openSettings);
    $('#closeSettings').addEventListener('click', closeSettings);
    els.modal.addEventListener('click', function (e) { if (e.target === els.modal) closeSettings(); });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!els.modal.classList.contains('hidden')) closeSettings();
      else closeSidebar();
    });

    els.history.addEventListener('click', function (e) {
      var del = e.target.closest('[data-delete]');
      if (del) {
        var id = del.dataset.delete;
        if (state.streaming && state.streaming.chatId === id) state.streaming.controller.abort();
        state.chats = state.chats.filter(function (c) { return c.id !== id; });
        if (state.activeId === id) state.activeId = null;
        persistChats();
        renderAll();
        return;
      }
      var item = e.target.closest('[data-chat]');
      if (item) {
        state.activeId = item.dataset.chat;
        closeSidebar();
        renderAll();
        scrollToBottom(false);
      }
    });

    els.messages.addEventListener('click', function (e) {
      var sug = e.target.closest('[data-suggest]');
      if (sug) { send(sug.dataset.suggest); return; }
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var chat = activeChat();
      if (!chat || state.streaming) return;
      var action = btn.dataset.action;
      if (action === 'copy') {
        var idx = Number(btn.dataset.index);
        navigator.clipboard.writeText(chat.messages[idx].content).then(function () {
          state.copiedIndex = idx;
          renderMessages();
          setTimeout(function () { state.copiedIndex = null; renderMessages(); }, 1500);
        });
      } else if (action === 'regenerate') {
        chat.messages.pop();
        generate(chat);
      } else if (action === 'retry') {
        generate(chat);
      }
    });

    els.composer.addEventListener('submit', function (e) {
      e.preventDefault();
      if (state.streaming) state.streaming.controller.abort();
      else send(els.input.value);
    });

    els.input.addEventListener('input', autosize);
    els.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        if (e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        if (!state.streaming) send(els.input.value);
      }
    });

    els.settingsBody.addEventListener('click', function (e) {
      var opt = e.target.closest('[data-setting]');
      if (opt) {
        updateSetting(opt.dataset.setting, opt.dataset.value);
        renderSettings();
        renderAll();
        return;
      }
      if (e.target.closest('[data-reset-layout]')) {
        updateSetting('uiScale', 100);
        updateSetting('density', 'compact');
        updateSetting('sidebarWidth', 100);
        renderSettings();
        applyLayout();
        return;
      }
      if (e.target.closest('[data-clear]')) {
        if (state.streaming) state.streaming.controller.abort();
        state.chats = [];
        state.activeId = null;
        persistChats();
        renderAll();
        closeSettings();
      }
    });

    els.settingsBody.addEventListener('input', function (e) {
      var field = e.target.dataset.field;
      if (!field) return;
      var value = e.target.value;
      if (field === 'uiScale' || field === 'sidebarWidth') value = Number(value);
      updateSetting(field, value);
      applyStaticText();
      applyLayout();
    });

    window.addEventListener('resize', function () { if (window.innerWidth >= 768) closeSidebar(); });

    applyTheme();
    applyLayout();
    renderStaticIcons();
    renderAll();
    els.input.focus();
  })();
  </script>
</body>
</html>
